name: CI

on:
  push:
    branches: ["main", "master", "Shafnat/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Nilai dummy: build tidak boleh butuh kredensial produksi.
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/jagofarm?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/jagofarm?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
